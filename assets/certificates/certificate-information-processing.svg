  <text x="350" y="100" text-anchor="middle" font-family="serif" font-size="44" font-weight="700" fill="#1e1b26">국가기술자격증</text>
  <text x="350" y="155" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1e1b26">정보처리기사 · SAMPLE COPY</text>
  <text x="90" y="220" font-family="sans-serif" font-size="20" fill="#1e1b26">성명</text>
  <rect x="185" y="194" width="260" height="34" fill="#1e1b26"/>
  <text x="90" y="270" font-family="sans-serif" font-size="20" fill="#1e1b26">자격번호</text>
  <rect x="185" y="244" width="330" height="34" fill="#1e1b26"/>
  <text x="90" y="320" font-family="sans-serif" font-size="20" fill="#1e1b26">취득일</text>
  <rect x="185" y="294" width="210" height="34" fill="#1e1b26"/>
  <circle cx="565" cy="345" r="58" fill="none" stroke="#d95f59" stroke-width="8"/>
  <text x="565" y="353" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#d95f59">MASKED</text>
  <text x="350" y="414" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#6a6570">개인정보 비공개 모형 · 실제 사본으로 교체</text>
