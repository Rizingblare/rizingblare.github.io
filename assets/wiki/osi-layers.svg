<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">OSI 7계층</title>
  <desc id="desc">응용 계층부터 물리 계층까지 일곱 블록이 위에서 아래로 배치됩니다.</desc>
  <rect width="760" height="520" fill="#f7f4ef"/>
  <g stroke="#1e1b26" stroke-width="6">
    <rect x="120" y="35" width="520" height="55" fill="#a866ff"/>
    <rect x="120" y="95" width="520" height="55" fill="#b78cff"/>
    <rect x="120" y="155" width="520" height="55" fill="#63d7b3"/>
    <rect x="120" y="215" width="520" height="55" fill="#7be1c2"/>
    <rect x="120" y="275" width="520" height="55" fill="#64b5f6"/>
    <rect x="120" y="335" width="520" height="55" fill="#8cc9fa"/>
    <rect x="120" y="395" width="520" height="55" fill="#ffd166"/>
  </g>
  <g font-family="sans-serif" font-size="23" font-weight="700" fill="#1e1b26">
    <text x="150" y="70">7 · 응용 계층 / Application</text>
    <text x="150" y="130">6 · 표현 계층 / Presentation</text>
    <text x="150" y="190">5 · 세션 계층 / Session</text>
    <text x="150" y="250">4 · 전송 계층 / Transport</text>
    <text x="150" y="310">3 · 네트워크 계층 / Network</text>
    <text x="150" y="370">2 · 데이터 링크 / Data Link</text>
    <text x="150" y="430">1 · 물리 계층 / Physical</text>
  </g>
  <text x="380" y="490" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#6a6570">책임을 나누고 장애 위치를 좁히는 참조 모델</text>
</svg>
