# 구조 선언 registry.
#
# 이 파일은 저장소에 어떤 path가 존재하고 각 path가 무엇을 위한 것인지 소유한다.
# "이것은 어디에 속하는가"에 대한 정본 답변이며,
# scripts/engine/registry.py가 기계적으로 읽는다.
#
# 전달받은 전체 골격을 이미 선언한 상태로 제공되므로, 아무것도 변경하기 전의 첫
# validator 실행부터 통과한다. 이는 의도된 것이다. 시작 골격을 선언하지 않는
# 초기 registry는 지침이 복사하라고 한 바로 그 파일 때문에 gate를 실패시키며,
# 새 사용자는 도구가 고장 났다고 합리적으로 판단하게 된다.
#
# 이 registry를 둘 가치가 있게 만드는 규칙: 어떤 declaration과도 일치하지 않는
# tracked path는 warning이 아니라 FAILURE다. tree를 설명하기만 하는 registry는
# 몇 주 안에 실제 tree와 drift가 생겨 오도한다. 선언되지 않은 path를 거부하는
# registry에는 drift가 생길 수 없다. drift는 commit되지 않기 때문이다.
#
# 등록은 의도와 같지 않으며 registry는 둘의 차이를 구분할 수 없다. path가 올바르게
# 선언되어 있어도 잘못된 disposition을 가질 수 있고 모든 registry 검사를 통과할 수
# 있다. 이 저장소에서 파생한 무언가를 배포한다면, 이 파일을 전혀 읽지 않는 두 번째
# 검사로 배포를 gate하라.
#
# 이곳의 변경은 decision procedure와 단일 writer를 거친다.
#
# Selector grammar(동결됨 — 아래 이외의 형식은 load error다):
#   docs/guide.md   정확히 일치하는 파일
#   docs/           directory의 직계 자식
#   docs/**         재귀 subtree
#   *               root-level 파일만
#   <name>          단일 path segment
#   **/<name>/**    어느 깊이에나 있는 지정된 이름의 directory
#
# Specificity는 exact, 더 긴 literal prefix, 더 적은 wildcard 순으로 우선한다.
# 같은 path와 일치하고 specificity도 같은 declaration이 두 개면 무작위 선택이 아니라
# error다. 순서가 attribution을 결정해서는 안 된다.

schema_version: 1
canonical_contract: AGENTS.md
project_manifest: schema/project/manifest.yaml
language_lint:
  check: scripts/harness_manifest.py
  coverage:
