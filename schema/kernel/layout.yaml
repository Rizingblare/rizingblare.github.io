  outside_coverage: contract-policy-only

# ── 선언 ─────────────────────────────────────────────────────────────────────
# role:        이 프로젝트의 vocabulary다. schema를 주입하여 제한할 수 있다
#              (scripts/engine/README.md 참조). 허용적인 기본값은 모든 string을
#              받아들이므로 오타가 load 시점에 검출되지 않는다.
# disposition: 이 kit가 path를 어떻게 처리했는지가 아니라, 이 저장소를 downstream에
#              배포할 때 해당 path를 어떻게 처리할지를 나타낸다.
#              ship = 그대로 복사 · stub = 고정된 범용 body로 교체 ·
#              seed = 빈 directory로 다시 생성 · skip = 배포하지 않음을 선언.
#              명시적으로 선언한 "no"는 조용히 생략한 것과 같지 않다.
# owner/provenance_layer/charter/entry_document/artifact_schema는 책임지는
#              path group과 그 group을 규율하는 문서를 식별한다.
# exposure:    distribution disposition과 독립적인 GitHub Pages 도달 범위다.
#              public-site에는 github-pages와 public-surface gate가 필요하다.
#              repository-only에는 exposure target이나 exposure gate가 필요 없다.
# producer_gate는 선언된 모든 group의 pre-commit repository gate다.

declarations:
  # ── 운영 계약 ──────────────────────────────────────────────────────────────
  # 규칙, 절차, form과 evidence chain이다. 아래에서 private subtree를 제외한
  # 나머지가 배포 가능한 부분이다.
  - select: schema/**
    role: contract
    disposition: ship
    owner: harness
    provenance_layer: operating-contract
    charter: schema/contracts/README.md
    entry_document: AGENTS.md
    artifact_schema: scripts/event_check.py
    exposure: repository-only
    exposure_target: none
    producer_gate: scripts/check.sh
    exposure_gate: not-applicable
    overrides:
      # evidence chain은 무엇을 실행했고 사용자가 무엇을 말했으며 무엇을 결정했는지 등
      # private 작업을 기록한다. 배포하지 않는 것으로 선언한다.
      #
      # override는 parent보다 엄격히 더 specific해야 하며 parent 안에 포함되어야 한다.
      # 그렇지 않으면 registry가 load를 거부한다. 아래 항목은 각각 schema/**의 정확한
      # subtree 하나이므로 두 조건을 모두 충족한다.
      - select: schema/observations/**
        disposition: skip
      - select: schema/feedbacks/**
        disposition: skip
      - select: schema/proposals/**
        disposition: skip
      - select: schema/evaluations/**
        disposition: skip
      - select: schema/decisions/**
        disposition: skip
      - select: schema/defers/**
        disposition: skip

      # handoff surface는 진행 중인 session state와 operating ledger를 담는다.
      # 여기의 어떤 것도 수신자에게 의미가 없다.
      #
      # volatile 영역은 정당하게 스스로 비워진다. successor가 인계받으면 snapshot은
      # DELETED된다. 그래도 subtree를 선언한다. 선언되지 않았거나 없는 path는 failure이며,
      # 이 row가 없으면 일상적인 삭제가 failure로 해석된다. 그러면 소비한 snapshot을
      # 영원히 보존해야 한다는 압력이 생겨 mechanism을 망가뜨린다.
      - select: schema/handoff/**
        disposition: skip

      # volatile multi-session workspace다. 설계상 종료 시 삭제한다.
      - select: schema/stages/**
        disposition: skip

  # ── 도구 ──────────────────────────────────────────────────────────────────
