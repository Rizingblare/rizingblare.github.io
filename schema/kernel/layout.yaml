# ── 제외 항목 ────────────────────────────────────────────────────────────────
# 설계상 untracked다. undeclared-path 검사가 우연이 아니라 의도적으로 건너뛰도록
# 목록에 둔다. 각 항목에는 명시된 reason이 있다. exclusion은 gap이 아니라
# decision이다.
#
# exclusion을 신뢰하기 전에 반드시 읽어라. exclusion과 declaration은 같은 specificity
# 순서로 결정되므로, 더 specific한 declaration이 path를 차지하지 않을 때만 exclusion이
# 그 path를 결정한다. 따라서 흩어진 pattern은 넓은 literal pattern에 우선권을 내준다.
# `**/__pycache__/**`는 `scripts/**`보다 덜 specific하므로 script 옆에 기록된 bytecode는
# 아래 exclusion이 아니라 해당 declaration의 disposition으로 결정된다. 이는 추정한
# 것이 아니라 loader로 측정한 결과다.
#
# 따라서 여기의 exclusion은 intent를 기록하고 `.gitignore`가 이를 강제한다. ignored
# path는 validator의 검사 대상에서 완전히 벗어나 어떤 declaration이 소유하는지 묻지
# 않는다. 두 목록을 항상 함께 맞춰라.

exclusions:
  - select: dist/**
    reason: "generated distribution output, not tracked"
  - select: node_modules/**
    reason: "tool-local dependencies"
  - select: "**/__pycache__/**"
    reason: "build residue"
  - select: .claude/**
    reason: "agent-harness workspace, session-local"
  - select: .mcp.json
    reason: "agent-harness MCP configuration, machine-local"
  - select: .impeccable/**
    reason: "design-tool session state"
  - select: .orca/**
    reason: "orchestration-tool session state"
  - select: .playwright-mcp/**
    reason: "browser-session artifacts"

# English brief
# This registry is the canonical declaration of repository paths, ownership,
# provenance, exposure, and validation gates. It rejects undeclared tracked paths,
# applies deterministic selector specificity and overrides, and records deliberate
# exclusions without changing any machine-facing data.
