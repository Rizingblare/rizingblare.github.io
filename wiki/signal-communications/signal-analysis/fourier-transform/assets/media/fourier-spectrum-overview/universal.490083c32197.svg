<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">시간 영역 파형과 주파수 스펙트럼</title>
  <desc id="desc">왼쪽에는 두 주파수가 합쳐진 파형, 오른쪽에는 10 헤르츠와 30 헤르츠 성분 막대가 표시됩니다.</desc>
  <rect width="960" height="360" fill="#f7f4ef"/>
  <g stroke="#d8d0c8" stroke-width="2">
    <path d="M60 65H420M60 115H420M60 165H420M60 215H420M60 265H420"/>
    <path d="M540 65H900M540 115H900M540 165H900M540 215H900M540 265H900"/>
  </g>
  <g stroke="#1e1b26" stroke-width="5" fill="none">
    <path d="M60 165H420M60 45V285"/>
    <path d="M540 285H900M540 45V285"/>
    <path d="M60 165 C80 80 100 250 120 165 S160 80 180 165 S220 250 240 165 S280 80 300 165 S340 250 360 165 S400 80 420 165" stroke="#a866ff" stroke-width="8"/>
    <path d="M650 285V95M805 285V180" stroke="#63d7b3" stroke-width="22"/>
  </g>
  <path d="M455 145H505M480 120L510 145L480 170" stroke="#1e1b26" stroke-width="8" fill="none"/>
  <text x="60" y="325" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#1e1b26">TIME DOMAIN x(t)</text>
  <text x="540" y="325" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#1e1b26">FREQUENCY SPECTRUM |X(f)|</text>
  <text x="630" y="315" font-family="ui-monospace,monospace" font-size="18" fill="#1e1b26">10 Hz</text>
  <text x="785" y="315" font-family="ui-monospace,monospace" font-size="18" fill="#1e1b26">30 Hz</text>
</svg>
